<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Notegeli</title>

        <link rel="manifest" href="manifest.json">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">
        <link rel="stylesheet" href="notegeli.css?v=1.1">
    </head>
    <body>
        <div class="app-container">
            <div id="view-main" class="d-flex flex-column h-100">

                <!-- 1. CABECERA -->
                <div
                    class="header-mini d-flex align-items-center justify-content-between mt-2 mb-2 p-2 rounded-3 flex-shrink-0"
                    style="background: rgba(255, 193, 7, 0.08); border-bottom: 2px solid rgba(255, 193, 7, 0.3);">

                    <div class="d-flex align-items-center gap-2">
                        <img src="icons/512.png"
                            class="logo-mini"
                            alt="Notegeli"
                            style="height: 28px; width: 28px; object-fit: contain;">

                        <h4 class="m-0 fw-bold"
                            style="font-size: 1.75rem; letter-spacing: 0.5px; color: #222;">
                            <span style="color: #d97706;">NOTAS v2.0</span>
                        </h4>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <div class="dropdown">
                            <button
                                class="btn btn-sm btn-light border-0 text-secondary p-1 px-2 rounded-circle"
                                type="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                                title="Configuración">
                                <i class="bi bi-gear text-warning"
                                    style="font-size: 1rem;"></i>
                            </button>

                            <ul
                                class="dropdown-menu dropdown-menu-end shadow-sm border-0"
                                style="min-width: 160px; font-size: 0.85rem;">

                                <li>
                                    <h6
                                        class="dropdown-header text-uppercase text-muted"
                                        style="font-size: 0.75rem;">Tamaño de
                                        texto</h6>
                                </li>
                                <li>
                                    <button class="dropdown-item py-1"
                                        onclick="cambiarTamanoFuente('normal')">
                                        Normal
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item py-1 fw-medium"
                                        onclick="cambiarTamanoFuente('grande')">
                                        Grande
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item py-1 fw-bold"
                                        onclick="cambiarTamanoFuente('muy-grande')">
                                        Muy Grande
                                    </button>
                                </li>

                                <!-- Separador -->
                                <li><hr class="dropdown-divider"></li>

                                <li>
                                    <h6
                                        class="dropdown-header text-uppercase text-muted"
                                        style="font-size: 0.75rem;">Copias de
                                        seguridad</h6>
                                </li>
                                <li>
                                    <button
                                        class="dropdown-item py-1 d-flex align-items-center gap-2"
                                        onclick="exportarBackup()">
                                        <i
                                            class="bi bi-download text-secondary"></i>
                                        Guardar Copia seguridad
                                    </button>
                                </li>
                                <li>
                                    <button
                                        class="dropdown-item py-1 d-flex align-items-center gap-2"
                                        onclick="importarBackup()">
                                        <i
                                            class="bi bi-upload text-secondary"></i>
                                        Restaurar
                                    </button>
                                </li>
                                <!-- Dentro de tu menú desplegable del engranaje en index.html -->

                            </ul>
                        </div>

                        <div
                            class="d-flex align-items-center gap-1 bg-white px-2 py-1 rounded-pill shadow-sm border">
                            <i class="bi bi-calendar-event text-warning"
                                style="font-size: 0.85rem;"></i>
                            <span id="fecha-actual-txt"
                                class="fecha-mini text-secondary fw-semibold"
                                style="font-size: 0.8rem; text-transform: capitalize;"></span>
                        </div>
                    </div>
                </div>

                <!-- 2. AVISOS -->
                <div id="avisos-container"
                    class="avisos-seccion flex-shrink-0"
                    style="margin-top: 5px; margin-bottom: 0; display: none;"></div>

                <!-- 3. FORMULARIO CREAR NOTA -->
                <form id="form-nueva-nota" onsubmit="crearNota(event)"
                    class="nuevo-form mt-0 flex-shrink-0 mb-2">
                    <textarea id="nueva-nota-texto" class="textarea"
                        placeholder="Crear nota..." required ></textarea>

                    <div
                        class="add-row d-flex justify-content-between align-items-center mt-2">
                        <div class="d-flex align-items-center gap-2">
                            <button type="button" class="btn-tool"
                                onclick="document.getElementById('nueva-nota-fecha').showPicker()"
                                title="Añadir fecha de recordatorio">
                                <i class="bi bi-calendar3"></i>
                            </button>

                            <button type="button" class="btn-tool"
                                onclick="abrirCalculadoraModal()"
                                title="Calculadora rápida">
                                <i class="bi bi-calculator"></i>
                            </button>

                            <button type="button" class="btn-tool"
                                onclick="toggleBarraBusqueda()"
                                title="Buscar en notas">
                                <i class="bi bi-search"></i>
                            </button>

                            <button type="button" class="btn-tool"
                                id="btn-icono-llave"
                                onclick="intentarAbrirPrivadas()"
                                title="Notas privadas">
                                <i class="bi bi-key"></i>
                            </button>

                            <button type="button" class="btn-tool"
                                id="btn-toggle-privada"
                                onclick="toggleModoPrivadaCreacion()"
                                title="Hacer nota privada">
                                <i class="bi bi-unlock"></i>
                            </button>
                            <input type="hidden" id="nueva-nota-privada"
                                value="false">

                            <span id="nueva-fecha-preview"
                                class="fecha-preview text-muted small"
                                style="font-size: 0.85rem;"></span>
                            <input type="date" id="nueva-nota-fecha"
                                class="input-fecha-hidden d-none"
                                onchange="actualizarFechaPreview()">
                        </div>

                        <button type="submit" class="btn-amber">+
                            Añadir</button>
                    </div>
                </form>

                <!-- BUSCADOR DESPLEGABLE (Recuperado) -->
                <div id="container-buscador-desplegable"
                    class="search-box mt-2 flex-shrink-0"
                    style="display: none;">
                    <div
                        class="input-group rounded-pill border bg-white shadow-sm overflow-hidden px-3 py-1">
                        <span
                            class="input-group-text bg-transparent border-0 text-warning ps-0">
                            <i class="bi bi-search"
                                style="font-size: 0.85rem;"></i>
                        </span>
                        <input type="text" id="input-buscar"
                            class="form-control border-0 shadow-none bg-transparent ps-2"
                            placeholder="Escribe para buscar..."
                            oninput="filtrarNotas()"
                            style="font-size: 0.85rem;">
                        <button
                            class="btn btn-link text-muted p-0 text-decoration-none"
                            type="button" id="clear-search"
                            onclick="limpiarBusqueda()" style="display: none;">
                            <i class="bi bi-x-circle-fill"></i>
                        </button>
                    </div>
                </div>

                <!-- 4. CONTENEDOR DE SCROLL PARA LAS NOTAS -->
                <div id="notes-scroll-container"></div>

                <!-- 5. FOOTER FIJO ABAJO -->
                <footer
                    class="footer-fijo text-center text-muted small py-2 border-top bg-red flex-shrink-0"
                    style="font-size: 0.8rem;">
                    <div
                        class="d-flex justify-content-center align-items-center gap-3">
                        <span>NoteGeli 2026</span>
                        <span>•</span>
                        <span id="hora-footer">17:36</span>

                    </div>
                </footer>

            </div>
        </div>

        <!-- MODALES (Fuera del flujo flex principal) -->
        <!-- Modal de Calculadora -->
        <div id="view-calc"
            style="display: none; position: fixed; inset: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9999; align-items: center; justify-content: center; padding: 0px;">
            <div class="nuevo-form p-3 shadow"
                style="width: 100%; margin: 0 auto; background: #fff;">
                <div
                    class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold m-0 text-secondary">
                        <i class="bi bi-calculator text-warning me-1"></i>
                        Calculadora
                    </h6>
                    <button type="button" class="btn-close btn-sm"
                        onclick="cerrarCalculadoraModal()"
                        aria-label="Cerrar"></button>
                </div>
                <input type="text" id="calc-display"
                    class="form-control text-end mb-2 fw-bold fs-5" readonly
                    value="0"
                    style="background: #f8f9fa;">
                <div class="row g-1">
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('7')">7</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('8')">8</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('9')">9</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-warning w-100 text-white"
                            onclick="calcAppend('/')">÷</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('4')">4</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('5')">5</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('6')">6</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-warning w-100 text-white"
                            onclick="calcAppend('*')">×</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('1')">1</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('2')">2</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('3')">3</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-warning w-100 text-white"
                            onclick="calcAppend('-')">-</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('0')">0</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-light w-100 border"
                            onclick="calcAppend('.')">.</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-secondary w-100"
                            onclick="calcClear()">C</button></div>
                    <div class="col-3"><button type="button"
                            class="btn btn-warning w-100 text-white"
                            onclick="calcAppend('+')">+</button></div>
                    <div class="col-12 mt-1">
                        <button type="button"
                            class="btn btn-success w-100 btn-sm"
                            onclick="calcCalculate()">
                            = Calcular / Copiar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal de Acceso Privado -->
        <div id="view-lock"
            style="display: none; position: fixed; inset: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 1050; align-items: center; justify-content: center; padding: 15px;">
            <div class="card p-4 shadow-lg border-0"
                style="width: 100%; max-width: 360px; border-radius: 20px;">
                <div
                    class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0 text-dark"><i
                            class="bi bi-shield-lock text-warning me-2"></i>Contraseña
                        Notas Privadas</h5>
                    <button type="button" class="btn-close shadow-none"
                        onclick="cerrarModalLock()"></button>
                </div>

                <input type="password" id="input-lock-pass"
                    class="form-control form-control-lg text-center mb-3 rounded-pill bg-light border-0"
                    placeholder="••••" maxlength="10"
                    style="letter-spacing: 4px;">
                <button type="button"
                    class="btn btn-amber w-100 py-2 rounded-pill fw-bold"
                    onclick="verificarPasswordLock()">Desbloquear</button>
            </div>
        </div>

        <!-- Modal de Editor -->
        <div id="view-edit"
            style="display: none; position: fixed; inset: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 9999; align-items: center; justify-content: center; padding: 15px;">
            <div class="nuevo-form"
                style="width: 100%; max-width: 500px; margin: 0 auto;">
                <h5 class="fw-bold mb-3" style="color: #333;">Editar Nota</h5>
                <form onsubmit="guardarEdicion(event)">
                    <input type="hidden" id="edit-id">
                    <input type="hidden" id="edit-color-input">
                    <textarea id="edit-textarea" class="textarea mb-2" rows="4"
                        placeholder="Escribir nota..." required></textarea>
                    <div class="d-flex align-items-center gap-2 my-2">
                        <small class="text-secondary fw-semibold">Color:</small>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn-color-dot"
                                style="background: #fff; border: 1px solid #ccc; width: 24px; height: 24px; border-radius: 50%;"
                                onclick="seleccionarColor(this, '')"
                                aria-label="Blanco"></button>
                            <button type="button" class="btn-color-dot"
                                style="background: #ffadad; border: none; width: 24px; height: 24px; border-radius: 50%;"
                                onclick="seleccionarColor(this, '#ffadad')"
                                aria-label="Rojo claro"></button>
                            <button type="button" class="btn-color-dot"
                                style="background: #ffd6a5; border: none; width: 24px; height: 24px; border-radius: 50%;"
                                onclick="seleccionarColor(this, '#ffd6a5')"
                                aria-label="Naranja claro"></button>
                            <button type="button" class="btn-color-dot"
                                style="background: #fdffb6; border: none; width: 24px; height: 24px; border-radius: 50%;"
                                onclick="seleccionarColor(this, '#fdffb6')"
                                aria-label="Amarillo claro"></button>
                            <button type="button" class="btn-color-dot"
                                style="background: #caffbf; border: none; width: 24px; height: 24px; border-radius: 50%;"
                                onclick="seleccionarColor(this, '#caffbf')"
                                aria-label="Verde claro"></button>
                            <button type="button" class="btn-color-dot"
                                style="background: #9bf6ff; border: none; width: 24px; height: 24px; border-radius: 50%;"
                                onclick="seleccionarColor(this, '#9bf6ff')"
                                aria-label="Azul claro"></button>
                        </div>
                    </div>
                    <div class="add-row d-flex gap-2 mt-2 align-items-center">
                        <span id="edit-fecha-preview"
                            class="fecha-preview flex-grow-1"
                            onclick="document.getElementById('edit-fecha-input').showPicker()"
                            style="cursor: pointer;"></span>
                        <input type="date" id="edit-fecha-input"
                            class="input-fecha-hidden d-none"
                            onchange="actualizarFechaEditPreview()">
                        <button type="button"
                            class="btn btn-link text-secondary text-decoration-none px-2"
                            onclick="cerrarEditor()">Cancelar</button>
                        <button type="submit" class="btn-amber">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
        <input type="file" id="input-importar" class="d-none"
            accept=".json,application/json"
            onchange="procesarArchivoBackup(event)">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="app.js?v=1.1"></script>
        <script>
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js');
            }
        </script>
    </body>
</html>
