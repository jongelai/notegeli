<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Entrar - Notegeli</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div class="login-box">
    <img src="{{ url_for('static', filename='logogeli.png') }}" class="login-logo-big" style="margin-bottom: 20px;">
    
    <h3 class="login-title">Notegeli</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="alert alert-danger" style="
                background-color: rgba(255, 0, 0, 0.1); 
                color: #ff6666; 
                border: 1px solid rgba(255, 0, 0, 0.2); 
                padding: 10px; 
                border-radius: 10px; 
                text-align: center; 
                margin-bottom: 15px; 
                font-size: 0.9rem;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="login-form">
        <input type="text" name="usuario" placeholder="Usuario" class="login-input" required autofocus>
        <input type="password" name="password" placeholder="Contraseña" class="login-input" required>
        <button type="submit" class="btn-amber login-btn">Entrar</button>
    </form>

    <div class="mt-4 text-center">
        <p style="color: #888; font-size: 0.85rem; margin-bottom: 5px;">¿No tienes cuenta?</p>
        <a href="/registro" style="color: #ffb400; text-decoration: none; font-weight: bold; font-size: 0.95rem;">
            Crear cuenta ahora
        </a>
    </div>
</div>

</body>
</html>
