<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notegeli</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Notegeli">

    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/192.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='notegeli.css') }}?v=1.2">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div id="view-main">
            <div class="header-mini d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <img src="{{ url_for('static', filename='icons/512.png') }}" class="logo-mini" style="height:24px">
                    <h4 class="m-0 fw-bold">NOTAS <span class="fecha-mini">{{ fecha_larga }}</span></h4>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <a href="/logout" style="color:inherit; font-size:1.2rem"><i class="bi bi-box-arrow-right"></i></a>
                    <div class="theme-switch-wrapper">
                        <label class="theme-switch">
                            <input type="checkbox" id="checkbox">
                            <div class="slider round">
                                <i class="bi bi-sun-fill"></i>
                                <i class="bi bi-moon-stars-fill"></i>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            {% if manana %}
                <div class="avisos-seccion" style="margin-top: 40px; margin-bottom: 5px;">
                    {% for m in manana %}
                        <div id="aviso-{{ m.id }}" class="aviso-barra d-flex align-items-center" 
                             style="background: rgba(0, 255, 204, 0.1); border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 10px; padding: 10px 15px; margin-bottom: 8px;">
                            <div class="calendar-icon-container" style="margin-right: 12px;">
                                <i class="bi bi-calendar3 pulse-icon" style="color: #00b38f; font-size: 1.1rem;"></i>
                            </div>
                            <div class="flex-grow-1" style="overflow: hidden;">
                                <small style="color: #00b38f; font-weight: bold; font-size: 0.7rem;">Mañana</small>
                                <span style="color: var(--text-nota); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ m.contenido }}</span>
                            </div>
                            <button onclick="borrarAvisoDirecto('/borrar/{{ m.id }}', 'aviso-{{ m.id }}')" style="background:none; border:none; color:#ff4444">
                                <i class="bi bi-trash3-fill"></i>
                            </button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" action="/" class="nuevo-form mt-2">
                <textarea name="texto" class="textarea" placeholder="Escribir nota..."></textarea>
                <div class="add-row d-flex gap-2 mt-2 align-items-center">
                    <button type="button" class="btn-cal-pick btn"><i class="bi bi-calendar3"></i></button>
                    <span class="fecha-preview flex-grow-1"></span>
                    <input type="date" name="fecha" class="input-fecha-hidden d-none">
                    <button type="submit" class="btn-amber">+ Añadir</button>
                </div>
            </form>

            <div class="notes-scroll mt-3">
                {% for n in notas %}
                    <div class="nota-fila {% if n.color %}tinted{% endif %}" id="nota-{{ n.id }}" style="{% if n.color %}--color-base: {{ n.color }};{% endif %}">
                        <div class="nota-link flex-fill">
                            <span class="nota-texto">{{ n.contenido }}</span>
                        </div>
                        <a href="/borrar/{{ n.id }}" class="btn-delete"><i class="bi bi-trash3"></i></a>
                    </div>
                {% else %}
                    <div class="skeleton-container">
                        <div class="nota-fila ghost-note"><div class="nota-link">No hay notas todavía...</div></div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        const toggleSwitch = document.querySelector('#checkbox');
        
        async function borrarAvisoDirecto(url, elementoId) {
            const elemento = document.getElementById(elementoId);
            elemento.style.opacity = "0";
            elemento.style.transform = "scale(0.9)";
            const response = await fetch(url);
            if (response.ok) setTimeout(() => elemento.remove(), 300);
        }

        toggleSwitch.addEventListener('change', (e) => {
            const theme = e.target.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        });

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggleSwitch.checked = true;
        }

        document.querySelector(".btn-cal-pick").addEventListener("click", () => document.querySelector(".input-fecha-hidden").showPicker());
        document.querySelector(".input-fecha-hidden").addEventListener("change", (e) => document.querySelector(".fecha-preview").textContent = e.target.value);
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('PWA lista'))
                .catch(err => console.log('Error PWA', err));
        });
    }
    </script>
</body>
</html>
