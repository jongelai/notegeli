<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notegeli</title>
    <!-- Manifest de tu PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <!-- Bootstrap v5.3 Oficial (Enlaces corregidos y completos) -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Tu archivo de estilos propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='notegeli.css') }}?v=9.9">
    <!-- Iconos oficiales de Bootstrap -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body>
    <div class="app-container">

        <!-- VISTA PRINCIPAL -->
        <div id="view-main">
            <div class="header-mini d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <img src="{{ url_for('static', filename='icons/512.png') }}" class="logo-mini" style="height:24px">
                    <h4 class="m-0 fw-bold">NOTAS <span class="fecha-mini" id="fecha-actual-txt"></span></h4>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="theme-switch-wrapper">
                        <label class="theme-switch">
                            <input type="checkbox" id="checkbox">
                            <div class="slider round">
                                <i class="bi bi-sun-fill"></i>
                                <i class="bi bi-moon-stars-fill"></i>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Sección de Avisos de Mañana -->
            <div id="avisos-container" class="avisos-seccion" style="margin-top: 40px; margin-bottom: 5px; display: none;"></div>

            <!-- Formulario para añadir nota (Botones restaurados en su sitio) -->
            <form id="form-nueva-nota" onsubmit="crearNota(event)" class="nuevo-form mt-2">
                <textarea id="nueva-nota-texto" class="textarea" placeholder="Escribir nota..." required></textarea>
                <div class="add-row d-flex gap-2 mt-2 align-items-center">
                    <button type="button" class="btn-cal-pick btn" onclick="document.getElementById('nueva-nota-fecha').click()"><i class="bi bi-calendar3"></i></button>
                    <button type="button" class="btn btn-outline-info rounded-circle" onclick="abrirLienzo()" style="width:40px; height:40px; padding:0;"><i class="bi bi-pencil-fill"></i></button>
                    <span id="nueva-fecha-preview" class="fecha-preview flex-grow-1"></span>
                    <input type="date" id="nueva-nota-fecha" class="input-fecha-hidden d-none" onchange="actualizarFechaPreview()">
                    <button type="submit" class="btn-amber">+ Añadir</button>
                </div>
            </form>

            <!-- Lista de tus notas guardadas -->
            <div id="notes-scroll-container" class="notes-scroll mt-3"></div>
        </div>

        <!-- VISTA EDICIÓN -->
        <div id="view-edit" style="display: none; flex-direction: column; padding: 20px;">
            <div class="header-mini d-flex align-items-center mb-3">
                <button onclick="cerrarEditor()" class="btn btn-link p-0 me-3" style="color:inherit; font-size:1.5rem; text-decoration:none;"><i class="bi bi-arrow-left"></i></button>
                <h4 class="m-0 fw-bold">Editar Nota</h4>
            </div>
            <form id="form-edit" onsubmit="guardarEdicion(event)" class="h-100 d-flex flex-column">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-color-input">
                <div class="color-picker-row d-flex gap-2 mb-3">
                    <div class="color-dot" onclick="seleccionarColor(this, '#ffd966')" style="background:#ffd966; width:25px; height:25px; border-radius:50%; cursor:pointer"></div>
                    <div class="color-dot" onclick="seleccionarColor(this, '#c3e88d')" style="background:#c3e88d; width:25px; height:25px; border-radius:50%; cursor:pointer"></div>
                    <div class="color-dot" onclick="seleccionarColor(this, '#82aaff')" style="background:#82aaff; width:25px; height:25px; border-radius:50%; cursor:pointer"></div>
                    <div class="color-dot" onclick="seleccionarColor(this, '#f07178')" style="background:#f07178; width:25px; height:25px; border-radius:50%; cursor:pointer"></div>
                    <div class="color-dot" onclick="seleccionarColor(this, '')" style="background:transparent; border:1px solid #ddd; width:25px; height:25px; border-radius:50%; cursor:pointer"></div>
                </div>
                <textarea id="edit-textarea" class="textarea flex-grow-1" style="min-height: 300px; padding: 15px;"></textarea>
                <div class="d-flex align-items-center gap-2 mt-3">
                    <div class="d-flex align-items-center" style="background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
                        <button type="button" class="btn-cal-pick-edit btn p-0" onclick="document.getElementById('edit-fecha-input').click()"><i class="bi bi-calendar3" style="color: #00ffcc; font-size: 1.4rem;"></i></button>
                        <input type="date" id="edit-fecha-input" class="d-none" onchange="actualizarFechaEditPreview()">
                        <span id="edit-fecha-preview" style="font-size: 0.75rem; color: #00ffcc; margin-left: 8px; font-weight: bold;"></span>
                    </div>
                    <button type="submit" class="btn-amber flex-grow-1 py-3">Guardar</button>
                </div>
            </form>
        </div>

    </div>



        <!-- MOTOR DE MEMORIA LOCAL COMPLETADO -->
    <script>
        var meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
        
        document.addEventListener("DOMContentLoaded", function() {
            mostrarFechaDeHoy();
            cargarNotasYAlertas();
        });

        function mostrarFechaDeHoy() {
            var hoy = new Date();
            var fechaLarga = hoy.getDate() + " " + meses[hoy.getMonth()] + " " + hoy.getFullYear();
            document.getElementById("fecha-actual-txt").innerText = fechaLarga;
        }

        function obtenerNotasDeMemoria() {
            return JSON.parse(localStorage.getItem("notegeli_notas")) || [];
        }

        function guardarNotasEnMemoria(notas) {
            localStorage.setItem("notegeli_notas", JSON.stringify(notas));
            cargarNotasYAlertas();
        }

        function cargarNotasYAlertas() {
            var notas = obtenerNotasDeMemoria();
            var containerNotas = document.getElementById("notes-scroll-container");
            var containerAvisos = document.getElementById("avisos-container");
            
            containerNotas.innerHTML = "";
            containerAvisos.innerHTML = "";
            
            var mañana = new Date();
            mañana.setDate(mañana.getDate() + 1);
            var año = mañana.getFullYear();
            var mes = String(mañana.getMonth() + 1).padStart(2, '0');
            var dia = String(mañana.getDate()).padStart(2, '0');
            var mañanaStr = año + "-" + mes + "-" + dia;

            var tieneAvisos = false;

            notas.forEach(function(n) {
                if (n.fecha_recordatorio === mañanaStr && !n.contenido.startsWith('data:image/')) {
                    tieneAvisos = true;
                    var avisoHTML = '<div id="aviso-' + n.id + '" class="aviso-barra d-flex align-items-center" style="background: rgba(0, 255, 204, 0.1); border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 10px; padding: 10px 15px; margin-bottom: 8px;">' +
                        '<div class="calendar-icon-container" style="margin-right: 12px;"><i class="bi bi-calendar3 pulse-icon" style="color: #00b38f; font-size: 1.1rem;"></i></div>' +
                        '<div class="flex-grow-1" style="overflow: hidden;">' +
                            '<small style="color: #00b38f; font-weight: bold; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; display: block;">Mañana</small>' +
                            '<span style="color: #ffffff !important; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">' + n.contenido + '</span>' +
                        '</div>' +
                        '<button onclick="eliminarNota(' + n.id + ')" style="background: none; border: none; color: #ff4444; padding: 5px; font-weight: bold;">Borrar</button>' +
                    '</div>';
                    containerAvisos.innerHTML += avisoHTML;
                }

                var esImagen = n.contenido.startsWith('data:image/');
                var estiloColor = n.color ? '--color-base: ' + n.color + '; border-left: 5px solid ' + n.color + ';' : '';
                var claseTinted = n.color ? 'tinted' : '';

                var cuerpoNota = esImagen ? '<img src="' + n.contenido + '" class="img-garabato">' : '<span class="nota-texto">' + n.contenido + '</span>';
                var tagFecha = n.fecha_recordatorio ? '<div class="nota-fecha-tag mt-1"><i class="bi bi-calendar3"></i><span>' + n.fecha_recordatorio + '</span></div>' : '';

                var notaHTML = '<div class="nota-fila ' + claseTinted + '" id="nota-' + n.id + '" style="' + estiloColor + '">' +
                    '<div class="nota-link flex-fill d-flex flex-column" style="cursor:pointer" onclick="clickNota(' + n.id + ', ' + esImagen + ')">' +
                        cuerpoNota + tagFecha +
                    '</div>' +
                    '<button onclick="eliminarNota(' + n.id + ')" class="btn-delete" style="background:none; border:none; padding:0 8px; color:#ff4444; font-weight:bold; font-size:0.95rem;">' +
                        'Borrar' +
                    '</button>' +
                '</div>';
                
                containerNotas.innerHTML += notaHTML;
            });

            containerAvisos.style.display = tieneAvisos ? "block" : "none";
        }

        function clickNota(id, esImagen) {
            var ArrayNotas = obtenerNotasDeMemoria();
            var encontrada = ArrayNotas.find(function(item) { return item.id === id; });
            if (!encontrada) return;

            if (esImagen) {
                alert("Visualizando garabato local");
            } else {
                abrirEditor(encontrada.id, encontrada.contenido, encontrada.color, encontrada.fecha_recordatorio);
            }
        }

        function crearNota(event) {
            event.preventDefault();
            var textoInput = document.getElementById("nueva-nota-texto");
            var fechaInput = document.getElementById("nueva-nota-fecha");
            
            if (!textoInput.value.trim()) return;

            var lista = obtenerNotasDeMemoria();
            var nuevaNota = {
                id: Date.now(),
                contenido: textoInput.value,
                fecha_recordatorio: fechaInput.value || null,
                color: "",
                fecha_creacion: new Date().toISOString()
            };

            lista.unshift(nuevaNota);
            guardarNotasEnMemoria(lista);

            textoInput.value = "";
            fechaInput.value = "";
            document.getElementById("nueva-fecha-preview").innerText = "";
        }

        function eliminarNota(id) {
            var lista = obtenerNotasDeMemoria();
            lista = lista.filter(function(n) { return n.id !== id; });
            guardarNotasEnMemoria(lista);
        }

        function abrirEditor(id, contenido, color, fecha) {
            document.getElementById("view-main").style.display = "none";
            document.getElementById("view-edit").style.display = "flex";

            document.getElementById("edit-id").value = id;
            document.getElementById("edit-textarea").value = contenido;
            document.getElementById("edit-color-input").value = color;
            document.getElementById("edit-fecha-input").value = fecha || "";
            document.getElementById("edit-fecha-preview").innerText = fecha || "";
        }

        function cerrarEditor() {
            document.getElementById("view-edit").style.display = "none";
            document.getElementById("view-main").style.display = "block";
        }

        function seleccionarColor(elemento, color) {
            document.getElementById("edit-color-input").value = color;
        }

        function guardarEdicion(event) {
            event.preventDefault();
            var id = parseInt(document.getElementById("edit-id").value);
            var texto = document.getElementById("edit-textarea").value;
            var color = document.getElementById("edit-color-input").value;
            var fecha = document.getElementById("edit-fecha-input").value;

            var lista = obtenerNotasDeMemoria();
            var index = lista.findIndex(function(n) { return n.id === id; });
            
            if (index !== -1) {
                lista[index].contenido = texto;
                lista[index].color = color;
                lista[index].fecha_recordatorio = fecha || null;
                guardarNotasEnMemoria(lista);
            }
            cerrarEditor();
        }

        function actualizarFechaPreview() {
            var fecha = document.getElementById("nueva-nota-fecha").value;
            document.getElementById("nueva-fecha-preview").innerText = fecha;
        }

        function actualizarFechaEditPreview() {
            var fecha = document.getElementById("edit-fecha-input").value;
            document.getElementById("edit-fecha-preview").innerText = fecha;
        }

        function abrirLienzo() { alert("Lienzo local listo"); }
    </script>
</body>
</html>
