<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Notegeli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #050505; color: white; display: flex; align-items: center; height: 100vh; justify-content: center; }
        .card { background: #111; border: 1px solid #333; padding: 20px; width: 90%; max-width: 400px; border-radius: 15px; }
        input { background: #222 !important; border: 1px solid #444 !important; color: white !important; margin-bottom: 15px; }
        .btn-amber { background: #ffb400; color: black; font-weight: bold; width: 100%; border-radius: 10px; padding: 10px; border: none; }
    </style>
</head>
<body>
    <div class="card">
        <h4 class="text-center mb-4">Crear Cuenta</h4>
        <form method="POST">
            <input type="text" name="usuario" class="form-control" placeholder="Nombre de usuario" required>
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            <button type="submit" class="btn-amber">Registrarse</button>
        </form>
        <p class="text-center mt-3"><small><a href="/login" style="color: #ffb400;">Ya tengo cuenta</a></small></p>
    </div>
</body>
</html>
